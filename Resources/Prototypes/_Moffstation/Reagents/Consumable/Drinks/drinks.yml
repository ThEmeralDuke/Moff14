  desc: reagent-desc-breathalyzer
  physicalDesc: reagent-physical-desc-nothing
  flavor: flavor-complex-breathalyzer-flavor
  color: "#ffffff"
  metamorphicSprite:
    sprite: /Textures/_Moffstation/Objects/Consumable/Drinks/breathalyzer.rsi
